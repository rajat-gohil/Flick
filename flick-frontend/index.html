<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/App_Store.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Synchronous Theme Initialization (Item 1) ── -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("flick_theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.style.colorScheme = theme;
        } catch (_e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

    <!-- ── PWA ─────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#42634A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <link rel="apple-touch-icon" href="/App_Store.svg" />

    <!-- ── SEO / Social ─────────────────────────────── -->
    <title>Flick — Movie Night, Decided</title>
    <meta name="description" content="Swipe through movies with your partner. Match on what to watch tonight." />
    <meta property="og:title" content="Flick — Movie Night, Decided" />
    <meta property="og:description" content="Swipe through movies with your partner. Match on what to watch tonight." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flickapp.in" />
    <meta name="twitter:card" content="summary" />

    <!-- ── Material Symbols font ─────────────────────── -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />

    <!-- ── Google Fonts: Manrope (UI) & Newsreader (Editorial) ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
