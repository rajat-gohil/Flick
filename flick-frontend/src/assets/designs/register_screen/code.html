<!DOCTYPE html>

<html class="dark"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flick - Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#a413ec",
            "background-light": "#f7f6f8",
            "background-dark": "#0F0F14",
            "surface-dark": "#1C1C24",
            "neutral-400": "#A09DB0",
            "neutral-600": "#4A455C",
            "neutral-700": "#322E40",
            "neutral-800": "#252131"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen antialiased flex flex-col items-center justify-center sm:p-6">
<!-- Mobile Container -->
<div class="w-full h-full sm:h-[844px] sm:w-[390px] bg-background-light dark:bg-background-dark sm:rounded-[3rem] sm:shadow-2xl overflow-hidden flex flex-col relative sm:border-[8px] sm:border-neutral-800">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between z-10">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center hover:bg-neutral-800 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<div class="text-primary text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
        Flick
      </div>
</div>
<!-- Main Content Content -->
<div class="flex-1 overflow-y-auto px-4 pb-8 flex flex-col z-10 relative">
<!-- Header -->
<div class="mt-4 mb-8">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold leading-tight tracking-tight text-center pb-2">Create an Account</h1>
<p class="text-neutral-400 text-sm font-normal leading-normal text-center max-w-[280px] mx-auto">Join Flick to start matching with movies you'll love.</p>
</div>
<!-- Floating Form Card -->
<div class="bg-white dark:bg-surface-dark rounded-3xl p-5 shadow-lg border border-neutral-200 dark:border-neutral-700/50 flex flex-col gap-5">
<!-- Email Input -->
<label class="flex flex-col flex-1">
<span class="text-slate-900 dark:text-slate-100 text-sm font-medium leading-normal pb-1.5 ml-1">Email</span>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-neutral-400 text-[20px]">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-1 focus:ring-primary border border-neutral-300 dark:border-neutral-600 bg-transparent h-14 placeholder:text-neutral-400 pl-12 pr-4 text-base font-normal leading-normal transition-all" placeholder="Enter your email address" type="email"/>
</div>
</label>
<!-- Password Input -->
<label class="flex flex-col flex-1">
<span class="text-slate-900 dark:text-slate-100 text-sm font-medium leading-normal pb-1.5 ml-1">Password</span>
<div class="relative flex w-full flex-1 items-stretch rounded-xl">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-[20px]">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-1 focus:ring-primary border border-neutral-300 dark:border-neutral-600 bg-transparent h-14 placeholder:text-neutral-400 pl-12 pr-12 text-base font-normal leading-normal transition-all" placeholder="Create a password" type="password" value="mypassword123"/>
<button class="absolute right-0 h-full px-4 text-neutral-400 hover:text-slate-900 dark:hover:text-slate-100 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</label>
<!-- Password Strength Meter -->
<div class="flex flex-col gap-1.5 px-1">
<div class="flex gap-1.5 h-1.5 w-full">
<div class="flex-1 bg-red-500 rounded-full"></div>
<div class="flex-1 bg-yellow-400 rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-neutral-300 dark:bg-neutral-600 rounded-full"></div>
</div>
<span class="text-xs font-medium text-primary text-right">Strong</span>
</div>
<!-- Checkboxes -->
<div class="flex flex-col gap-3 mt-2">
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center mt-0.5">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 rounded border-2 border-neutral-400 dark:border-neutral-600 peer-checked:bg-primary peer-checked:border-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all">check</span>
</div>
</div>
<span class="text-slate-600 dark:text-neutral-400 text-sm leading-tight flex-1">
              I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a>
</span>
</label>
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center mt-0.5">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-5 h-5 rounded border-2 border-neutral-400 dark:border-neutral-600 peer-checked:bg-primary peer-checked:border-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100 scale-50 peer-checked:scale-100 transition-all">check</span>
</div>
</div>
<span class="text-slate-600 dark:text-neutral-400 text-sm leading-tight flex-1">
              I accept the <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>
</span>
</label>
</div>
</div>
<!-- Action Button -->
<div class="mt-auto pt-8 pb-4 flex flex-col gap-4">
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-[#c44df6] text-white font-bold text-lg shadow-[0_0_20px_rgba(164,19,236,0.3)] hover:shadow-[0_0_25px_rgba(164,19,236,0.5)] transition-shadow">
          Continue
        </button>
<p class="text-center text-sm text-neutral-400">
          Already have an account? <a class="text-primary font-medium hover:underline" href="#">Log in</a>
</p>
</div>
</div>
<!-- Decorative Ambient Glow -->
<div class="absolute top-[-10%] left-[-20%] w-[60%] h-[40%] bg-primary/20 blur-[100px] rounded-full pointer-events-none z-0"></div>
</div>
</body></html>
