<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>App Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a413ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#1c1022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-[#1a0f1f] shadow-xl">
<!-- Header -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 bg-white/80 dark:bg-[#1a0f1f]/80 backdrop-blur-md z-10 border-b border-slate-200 dark:border-primary/20">
<button class="flex size-12 shrink-0 items-center justify-center text-slate-700 dark:text-slate-300 hover:text-primary dark:hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Settings</h2>
</div>
<div class="flex-1 overflow-y-auto pb-8">
<!-- Appearance Section -->
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-4 pb-2 pt-6">Appearance</h3>
<div class="flex flex-col gap-1 px-2">
<div class="flex items-center gap-4 px-4 py-3 min-h-[56px] justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">dark_mode</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate text-slate-800 dark:text-slate-200">Dark Mode</p>
</div>
<div class="shrink-0">
<label class="relative flex h-8 w-14 cursor-pointer items-center rounded-full bg-slate-200 dark:bg-primary/30 p-1 has-[:checked]:bg-primary transition-colors duration-300">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="h-6 w-6 rounded-full bg-white shadow-sm ring-1 ring-slate-900/5 transition-all duration-300 peer-checked:translate-x-6 flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-slate-400 peer-checked:text-primary transition-opacity hidden peer-checked:block">dark_mode</span>
<span class="material-symbols-outlined text-[14px] text-amber-500 block peer-checked:hidden">light_mode</span>
</div>
</label>
</div>
</div>
</div>
<!-- Notifications Section -->
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-4 pb-2 pt-6">Notifications</h3>
<div class="flex flex-col gap-1 px-2">
<div class="flex items-center gap-4 px-4 py-3 min-h-[56px] justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">notifications_active</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate text-slate-800 dark:text-slate-200">Push Notifications</p>
</div>
<div class="shrink-0">
<label class="relative flex h-8 w-14 cursor-pointer items-center rounded-full bg-slate-200 dark:bg-primary/30 p-1 has-[:checked]:bg-primary transition-colors duration-300">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="h-6 w-6 rounded-full bg-white shadow-sm ring-1 ring-slate-900/5 transition-all duration-300 peer-checked:translate-x-6"></div>
</label>
</div>
</div>
<div class="flex items-center gap-4 px-4 py-3 min-h-[56px] justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">mail</span>
</div>
<div class="flex flex-col">
<p class="text-base font-medium leading-normal text-slate-800 dark:text-slate-200">Email Updates</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Weekly movie recommendations</p>
</div>
</div>
<div class="shrink-0">
<label class="relative flex h-8 w-14 cursor-pointer items-center rounded-full bg-slate-200 dark:bg-primary/30 p-1 has-[:checked]:bg-primary transition-colors duration-300">
<input class="peer sr-only" type="checkbox"/>
<div class="h-6 w-6 rounded-full bg-white shadow-sm ring-1 ring-slate-900/5 transition-all duration-300 peer-checked:translate-x-6"></div>
</label>
</div>
</div>
</div>
<!-- Account Section -->
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-4 pb-2 pt-6">Account</h3>
<div class="flex flex-col gap-1 px-2">
<button class="flex items-center gap-4 px-4 py-3 min-h-[56px] w-full justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors group">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate text-slate-800 dark:text-slate-200">Profile Details</p>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="flex items-center gap-4 px-4 py-3 min-h-[56px] w-full justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors group">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">subscriptions</span>
</div>
<div class="flex flex-col items-start">
<p class="text-base font-medium leading-normal text-slate-800 dark:text-slate-200">Subscription</p>
<p class="text-xs text-primary font-medium">Pro Plan Active</p>
</div>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- Help & Privacy Section -->
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-4 pb-2 pt-6">More</h3>
<div class="flex flex-col gap-1 px-2">
<button class="flex items-center gap-4 px-4 py-3 min-h-[56px] w-full justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors group">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">shield</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate text-slate-800 dark:text-slate-200">Privacy &amp; Security</p>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<button class="flex items-center gap-4 px-4 py-3 min-h-[56px] w-full justify-between rounded-xl hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors group">
<div class="flex items-center gap-4">
<div class="flex items-center justify-center rounded-lg bg-primary/10 dark:bg-primary/20 text-primary shrink-0 size-10">
<span class="material-symbols-outlined">help</span>
</div>
<p class="text-base font-medium leading-normal flex-1 truncate text-slate-800 dark:text-slate-200">Help Center</p>
</div>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
<!-- Logout -->
<div class="px-6 pt-8 pb-4">
<button class="w-full py-3.5 px-4 rounded-xl font-medium text-red-500 dark:text-red-400 bg-red-50 hover:bg-red-100 dark:bg-red-500/10 dark:hover:bg-red-500/20 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">logout</span>
                    Log Out
                </button>
<p class="text-center text-xs text-slate-400 mt-4">App Version 2.4.1</p>
</div>
</div>
</div>
</body></html>
