<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flick - Register</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a413ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#1c1022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1rem", // 16px as requested
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display antialiased selection:bg-primary/30">
<!-- Mobile Container -->
<div class="relative flex min-h-screen w-full max-w-[480px] mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl shadow-primary/5">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<button class="flex size-11 shrink-0 items-center justify-center rounded-full bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition-colors text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined text-2xl">chevron_left</span>
</button>
</div>
<!-- Header -->
<div class="px-6 pt-6 pb-8">
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight">Create Account</h1>
<p class="text-slate-600 dark:text-slate-400/80 mt-2.5 text-base font-normal">Join Flick to find your next favorite movie.</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col flex-1 px-6 space-y-4">
<!-- Email Input -->
<label class="flex flex-col w-full group">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500 group-focus-within:text-primary transition-colors">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:ring-0 border border-black/10 dark:border-white/10 bg-white dark:bg-black/20 focus:border-primary dark:focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500/70 pl-12 pr-4 text-base font-normal transition-all shadow-sm" placeholder="Email Address" required="" type="email"/>
</div>
</label>
<!-- Password Input -->
<label class="flex flex-col w-full group">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500 group-focus-within:text-primary transition-colors">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:ring-0 border border-black/10 dark:border-white/10 bg-white dark:bg-black/20 focus:border-primary dark:focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500/70 pl-12 pr-12 text-base font-normal transition-all shadow-sm" placeholder="Password" required="" type="password"/>
<button class="absolute right-4 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</label>
<!-- Confirm Password Input -->
<label class="flex flex-col w-full group">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500 group-focus-within:text-primary transition-colors">lock_reset</span>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-slate-900 dark:text-white focus:outline-none focus:ring-0 border border-black/10 dark:border-white/10 bg-white dark:bg-black/20 focus:border-primary dark:focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-slate-500/70 pl-12 pr-4 text-base font-normal transition-all shadow-sm" placeholder="Confirm Password" required="" type="password"/>
</div>
</label>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full bg-primary hover:bg-primary/90 text-white rounded-xl h-14 font-semibold text-base shadow-lg shadow-primary/25 transition-all active:scale-[0.98]" type="submit">
                    Sign Up
                </button>
</div>
</form>
<!-- Social Login Section -->
<div class="px-6 pb-10 flex flex-col mt-8">
<!-- Divider -->
<div class="flex items-center gap-4 mb-6">
<div class="h-px flex-1 bg-black/5 dark:bg-white/10"></div>
<span class="text-[13px] font-medium text-slate-500 dark:text-slate-400/80 uppercase tracking-wider">Or continue with</span>
<div class="h-px flex-1 bg-black/5 dark:bg-white/10"></div>
</div>
<!-- Social Buttons Row -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2.5 h-14 rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 transition-all shadow-sm">
<svg fill="none" height="22" viewbox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-slate-900 dark:text-white font-medium text-sm">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2.5 h-14 rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-white/5 hover:bg-black/5 dark:hover:bg-white/10 transition-all shadow-sm">
<svg class="text-slate-900 dark:text-white" fill="currentColor" height="22" viewbox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 13.91C17.05 10.74 19.64 9.19 19.76 9.12C18.25 6.91 15.93 6.6 15.15 6.51C13.15 6.3 11.23 7.68 10.19 7.68C9.17 7.68 7.55 6.47 5.86 6.5C3.65 6.53 1.62 7.8 0.5 9.77C-1.81 13.79 0.4 19.74 2.65 22.97C3.74 24.54 5.01 26.29 6.69 26.23C8.31 26.17 8.94 25.18 10.88 25.18C12.8 25.18 13.37 26.23 15.08 26.2C16.85 26.17 17.96 24.58 19.03 23.01C20.27 21.2 20.78 19.43 20.81 19.34C20.76 19.32 17.05 17.91 17.05 13.91Z"></path>
<path d="M14.07 4.2C14.96 3.12 15.56 1.59 15.4 0.05C14.08 0.11 12.43 0.94 11.51 2.01C10.68 2.96 10.01 4.54 10.21 6.04C11.68 6.15 13.18 5.28 14.07 4.2Z"></path>
</svg>
<span class="text-slate-900 dark:text-white font-medium text-sm">Apple</span>
</button>
</div>
<!-- Login Link -->
<div class="mt-12 flex justify-center">
<p class="text-sm text-slate-600 dark:text-slate-400">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:text-primary/80 transition-colors ml-1" href="#">Log in</a>
</p>
</div>
</div>
</div>
</body></html>
