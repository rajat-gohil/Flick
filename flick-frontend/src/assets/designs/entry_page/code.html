<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flick - Entry Page</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a413ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#1c1022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased min-h-screen flex justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl">
<div class="flex-1 w-full relative flex flex-col">
<!-- Hero Image with Gradient Overlay -->
<div class="relative flex-1 w-full flex flex-col justify-end overflow-hidden min-h-[50vh]">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat" data-alt="Vibrant movie poster collage" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBBMLQj0yXIEwjNmuiU4PCeQo3G4IbOvY1ZjzWk-TQqxDRGMKx1Tf0ZJlMi6hNry_d4b9Q2dO53uSXfcgYh-YruOVg_ThAOWxDOVtELvv5klW8yPPKxBLAre0qUNQ_cn7dIOugKDWsAaQ58SXoZ2pxdJuNJtXIdfTMzAh4Bm9zziOotrTyzUljcmgqMG6opVh_av6Cl-oZfyxW6uk_Hw7e4SAzlTw48bKCSpkHQEzK75-bu5VHPA0XHvtooW6LATxJO_e37kl6x7Jg');">
</div>
<!-- Gradient to fade into background color -->
<div class="absolute inset-0 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light/50 dark:via-background-dark/50 to-transparent"></div>
</div>
<!-- Content Section -->
<div class="relative z-10 flex flex-col items-center px-6 pb-12 pt-8">
<!-- Logo area -->
<div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-white text-4xl" data-icon="movie">movie</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-4xl font-bold leading-tight text-center mb-2">
                    Flick
                </h1>
<p class="text-slate-600 dark:text-slate-300 text-lg font-normal leading-normal text-center mb-10 max-w-[280px]">
                    Find a movie you'll both love
                </p>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4">
<button class="flex items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-primary/90 transition-colors text-white text-lg font-semibold leading-normal tracking-wide w-full shadow-md shadow-primary/20">
<span class="truncate">Get Started</span>
</button>
<button class="flex items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary/10 dark:bg-primary/20 hover:bg-primary/20 dark:hover:bg-primary/30 transition-colors text-primary text-lg font-semibold leading-normal tracking-wide w-full">
<span class="truncate">Login</span>
</button>
</div>
</div>
</div>
</div>
