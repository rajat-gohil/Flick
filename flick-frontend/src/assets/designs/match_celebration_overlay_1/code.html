<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Match Celebration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a413ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#1c1022",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between overflow-hidden relative">
<!-- Background Confetti Elements (Abstracted with CSS shapes/gradients for visual interest) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden opacity-30">
<div class="absolute top-[10%] left-[20%] w-3 h-3 bg-primary rounded-full blur-[1px]"></div>
<div class="absolute top-[30%] right-[15%] w-4 h-4 bg-primary/60 rounded blur-[1px] rotate-45"></div>
<div class="absolute top-[50%] left-[10%] w-2 h-6 bg-primary/40 rounded-full blur-[1px] rotate-12"></div>
<div class="absolute top-[70%] right-[25%] w-3 h-3 bg-primary/80 rounded-full blur-[1px]"></div>
<div class="absolute bottom-[20%] left-[30%] w-5 h-5 bg-primary/50 rounded-lg blur-[2px] -rotate-12"></div>
</div>
<div class="relative flex-1 flex flex-col pt-12 pb-8 px-4 z-10">
<!-- Header -->
<div class="flex items-center justify-center p-4">
<h2 class="text-primary text-xl font-bold tracking-tight">Flick</h2>
</div>
<div class="flex-1 flex flex-col justify-center items-center py-6">
<h1 class="text-[40px] font-bold leading-tight text-center text-primary drop-shadow-md mb-2">
                It's a Match!
            </h1>
<p class="text-slate-600 dark:text-slate-300 text-lg text-center mb-10 px-4">
                You and your partner both want to watch this!
            </p>
<!-- Movie Posters Stack -->
<div class="relative w-full max-w-[320px] aspect-[3/4] mx-auto mb-10">
<!-- Background Poster (Partner's choice) -->
<div class="absolute inset-0 -rotate-6 transform translate-x-4 -translate-y-4 rounded-xl overflow-hidden shadow-2xl border-4 border-background-light dark:border-background-dark bg-slate-200 dark:bg-slate-800">
<div class="w-full h-full bg-center bg-no-repeat bg-cover opacity-80" data-alt="Action movie poster with dark moody lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCCSGXdAk8JeALQmc9wjlJjv2OGzU7vvL83HuT4FAvQfcmxO1Lj1g87dAZ_nK0pc4FlyJ5moq-pX_SzhRbxsDRTRgVamT8hfiqhbnbMKhYgWUoVx1OmGmgIW0REYyNp9W2-17yQzU2Bsx_Ro3Vb7JF5kF5LhonwEHIQAzWxdkmp4mqRSC31cNZ6bEDoWDQ2Pjfc9qwNOv49z9AUXwJDkd1F-S3Dqz7I990japuPnAAudafX8hbvOxrO17zNJ85NXcuitGbV3SzsAs4');"></div>
</div>
<!-- Foreground Poster (Your choice) -->
<div class="absolute inset-0 rotate-3 transform -translate-x-2 translate-y-2 rounded-xl overflow-hidden shadow-2xl border-4 border-background-light dark:border-background-dark bg-slate-200 dark:bg-slate-800 z-10">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Sci-fi movie poster with bright neon colors" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBAUWW0fHWahTStIw3t91saT4hwdyR7rDjBgRNcIjIwuqeP-8KvbA_yv2wxR2BFZItwO_ACaQjoJLhsgFQ-QyfHyUdNByB3k-5rOc3iQfpZ6iNXEtLqV5jyT30KDf8ibkI_k9zB1lLYd1VYAZYHza0IAbBBq9LImcQSHT0iTWFw4UtWsKV7AWIXRH2dkL-k_JFmoMYlviMqy8_2fibmxKma-S6jo_nbrRdmuGXyUj-kHr_uuZTLacac5kLMEP_fkjoti5Qfzb6d7So');"></div>
</div>
<!-- Match Icon Overlay -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-20 bg-background-light dark:bg-background-dark p-3 rounded-full shadow-xl">
<div class="bg-primary rounded-full p-3 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-3xl">favorite</span>
</div>
</div>
</div>
<h3 class="text-2xl font-bold text-center mb-1">Blade Runner 2049</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-8 flex items-center justify-center gap-2">
<span>Sci-Fi</span> • <span>2h 44m</span> • <span>8.0/10</span>
</p>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-[480px] mx-auto mt-auto flex flex-col gap-3">
<button class="flex items-center justify-center gap-2 rounded-full h-14 px-6 bg-primary hover:bg-primary/90 text-white text-lg font-bold w-full transition-colors shadow-lg shadow-primary/30">
<span class="material-symbols-outlined">play_circle</span>
                Stream Now
            </button>
<button class="flex items-center justify-center gap-2 rounded-full h-14 px-6 bg-primary/10 dark:bg-primary/20 hover:bg-primary/20 dark:hover:bg-primary/30 text-primary dark:text-white text-lg font-bold w-full transition-colors">
<span class="material-symbols-outlined">style</span>
                Keep Swiping
            </button>
</div>
</div>
</body></html>
