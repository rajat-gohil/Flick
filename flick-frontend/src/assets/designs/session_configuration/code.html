<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Session Configuration - Flick</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#a413ec",
          "background-light": "#f7f6f8",
          "background-dark": "#1c1022",
        },
        fontFamily: {
          "display": ["Inter"]
        },
        borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
      },
    },
  }
</script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
<!-- App Header / Background representation -->
<div class="flex-1 bg-slate-200 dark:bg-slate-800 relative bg-cover bg-center" data-alt="Dark theater screen with subtle purple lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDVjCk3v6prsz58FrUVXVCo3X0PtffSIOfDoHG8wPHdlFt-oVEe2iOlCWGelMK7sm3tV_xnJmgqoqRcBVtrRvsp2BjMCdgmqe1GyJQ2NIj9MmtbVATXgtCT2su1_4ukBDNbdjBvH3fQJea4G2HSgnpL8kFXrfD6Ag2dHMPjnxnUw9yu6_odGZcKu6g_XN-Yu2mlo_s3G1sRqUbONd_CY7OFZ8bRmbFAibDV2sO8wksKi0JdVsLlD9yx580c7JDemxanWWZ_Ke6l1HM');">
<div class="absolute inset-0 bg-black/60 dark:bg-black/80"></div>
<!-- Top Bar -->
<div class="relative z-10 flex items-center justify-between p-4">
<button class="text-white hover:bg-white/10 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-white text-xl font-bold tracking-tight">Flick</h1>
<button class="text-white hover:bg-white/10 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">person</span>
</button>
</div>
</div>
<!-- Bottom Sheet -->
<div class="flex absolute top-0 left-0 h-full w-full flex-col justify-end items-stretch pointer-events-none">
<div class="flex flex-col items-stretch bg-white dark:bg-[#25152d] rounded-t-[32px] pointer-events-auto shadow-[0_-8px_30px_rgba(0,0,0,0.3)] border-t border-white/10 transition-transform duration-300 transform translate-y-0">
<!-- Handle -->
<button class="flex h-8 w-full items-center justify-center pt-2">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-600"></div>
</button>
<div class="flex-1 pb-8 px-2">
<h2 class="text-slate-900 dark:text-white text-[28px] font-bold leading-tight tracking-[-0.015em] px-4 pb-1 pt-2">New Session</h2>
<p class="text-slate-500 dark:text-slate-400 px-4 pb-6 text-sm">Configure what you want to watch tonight.</p>
<!-- Mood Section -->
<div class="mb-6">
<h3 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-3">Mood</h3>
<div class="flex gap-3 p-1 flex-wrap px-4">
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-slate-100 dark:bg-primary/20 border border-transparent hover:border-primary/50 transition-colors pl-3 pr-4">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">sentiment_calm</span>
<p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal">Chill</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-primary text-white pl-3 pr-4 shadow-lg shadow-primary/30">
<span class="material-symbols-outlined" style="font-size: 20px;">local_fire_department</span>
<p class="text-white text-sm font-medium leading-normal">Intense</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-slate-100 dark:bg-primary/20 border border-transparent hover:border-primary/50 transition-colors pl-3 pr-4">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">mist</span>
<p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal">Scared</p>
</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-xl bg-slate-100 dark:bg-primary/20 border border-transparent hover:border-primary/50 transition-colors pl-3 pr-4">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">celebration</span>
<p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal">Excited</p>
</button>
</div>
</div>
<!-- Language Section -->
<div class="mb-8">
<h3 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-3">Language</h3>
<div class="px-4">
<div class="relative">
<select class="w-full appearance-none bg-slate-100 dark:bg-black/30 border border-slate-200 dark:border-white/10 text-slate-900 dark:text-white rounded-xl py-3 pl-4 pr-10 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
<option value="en">English</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="any">Any Language</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Call to Action -->
<div class="px-4 pt-2">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold text-lg py-4 rounded-xl flex items-center justify-center gap-2 transition-all transform active:scale-[0.98] shadow-lg shadow-primary/25">
<span>Start Flicking</span>
<span class="material-symbols-outlined">play_arrow</span>
</button>
</div>
</div>
</div>
</div>
</div>
</body></html>
